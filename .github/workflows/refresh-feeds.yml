name: Refresh Feeds

# BACKSTOP ONLY. The primary schedule now lives in vercel.json `crons`, which
# calls /api/refresh-feeds. This workflow used to be the primary and was demoted
# because GitHub's free scheduler drifts: across 2026-07-23..26 every one of ten
# scheduled runs fired late — the 01:00 UTC slot by 3.2–3.5 h, 13:00 by 1.6–2.2 h
# and 19:00 by 1.2–1.3 h. Nothing was skipped; it is simply never on time, and a
# 3.5 h drift overnight means the morning edition can be half a day old.
#
# It is kept, at ONE non-overlapping hour, purely so a silent failure of Vercel
# Cron cannot leave the wire stale indefinitely. Being late here no longer
# matters — nothing depends on it. Delete it if you would rather have a single
# scheduler.
#
# Both paths POST the same Deploy Hook, so the secret below and the Vercel env
# var VERCEL_DEPLOY_HOOK_URL hold the same value. Neither commits to the repo —
# the feed JSON is a build artifact (Phase 2 spec §4).
#
# Setup (one-time):
#   1. Vercel → Project → Settings → Git → Deploy Hooks → create a hook on the
#      production branch (main). Copy the URL.
#   2. GitHub → repo Settings → Secrets and variables → Actions → New secret
#      named VERCEL_DEPLOY_HOOK_URL, paste the URL.
# Until the secret exists the job no-ops (so it never fails red).

on:
  schedule:
    # 07:00 UTC ≈ midnight Pacific — deliberately between the Vercel cron hours
    # (01:00, 13:00, 19:00 UTC) so a late run never doubles up on a build.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set yet — skipping (no-op)."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK" && echo "Rebuild triggered."
