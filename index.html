<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E5E1D6" />

  <!--
    Title and description are deliberately absent from this template. Every
    route sets its own via src/components/PageMeta.tsx, which vite-react-ssg
    injects at prerender. Static ones here would ship alongside those, giving
    every page a duplicate of each. Any new route must render PageMeta.
  -->

  <!-- Type stack: Manufacturing Consent (nameplate) · Old Standard TT (headlines + data + labels) · Libre Baskerville (body). Anton, VT323 and Press Start 2P are for the arena scoreboards only. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Anton&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Manufacturing+Consent&family=Old+Standard+TT:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
